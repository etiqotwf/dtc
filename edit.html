<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>لوحة إدارة الدورات</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f3f6f9;
      color: #222;
    }

    .container {
      width: min(650px, 94%);
      margin: 35px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 26px;
    }

    /* ==========================================================
       أزرار الصفحات الثلاث
       ========================================================== */

    .page-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .page-button {
      margin: 0;
      padding: 13px 8px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #e9ecef;
      color: #333;
      transition: 0.2s;
    }

    .page-button:hover {
      opacity: 0.9;
    }

    .page-button.active {
      background: #0d6efd;
      color: white;
    }

    .page-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
      color: #0d6efd;
      font-size: 18px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      direction: rtl;
      background: white;
    }

    input[type="date"] {
      direction: ltr;
      text-align: left;
    }

    #saveButton {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #198754;
      color: white;
    }

    #saveButton:hover {
      opacity: 0.9;
    }

    #saveButton:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      display: block;
      background: #f8d7da;
      color: #842029;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .note {
      margin-top: 20px;
      padding: 12px;
      background: #fff3cd;
      color: #664d03;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.7;
    }

    .current-file {
      text-align: center;
      margin-bottom: 20px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 8px;
      color: #555;
      font-size: 14px;
    }

    @media (max-width: 500px) {

      .page-buttons {
        grid-template-columns: 1fr;
      }

      .page-button {
        padding: 14px;
      }

    }

  </style>
</head>


<body>

<div class="container">

  <div class="card">

    <h1>
      ✏️ لوحة إدارة الدورات
    </h1>


    <!-- ==========================================================
         أزرار الصفحات الثلاث
         ========================================================== -->

    <div class="page-buttons">

      <button
        type="button"
        class="page-button active"
        data-page="index1"
        onclick="changePage('index1')">

        🟦 الصفحة الأولى

      </button>


      <button
        type="button"
        class="page-button"
        data-page="index2"
        onclick="changePage('index2')">

        🟩 الصفحة الثانية

      </button>


      <button
        type="button"
        class="page-button"
        data-page="index3"
        onclick="changePage('index3')">

        🟧 الصفحة الثالثة

      </button>

    </div>


    <!-- اسم الملف الحالي -->

    <div
      id="currentFile"
      class="current-file">

      الملف الحالي: index.html

    </div>


    <div id="loading" class="loading">

      جاري تحميل الدورات...

    </div>


    <div id="formArea" style="display:none;">


      <!-- ==========================================================
           اختيار الدورة
           ========================================================== -->

      <label for="courseSelect">
        اختر الدورة
      </label>

      <select id="courseSelect">

        <option value="">
          اختر الدورة...
        </option>

      </select>


      <!-- ==========================================================
           اسم الدورة
           ========================================================== -->

      <label for="courseName">
        اسم الدورة
      </label>

      <input
        type="text"
        id="courseName"
        placeholder="اكتب اسم الدورة">


      <!-- ==========================================================
           تاريخ البداية
           ========================================================== -->

      <label for="startDate">
        تاريخ البداية
      </label>

      <input
        type="date"
        id="startDate">


      <!-- ==========================================================
           تاريخ النهاية
           ========================================================== -->

      <label for="endDate">
        تاريخ النهاية
      </label>

      <input
        type="date"
        id="endDate">


      <!-- ==========================================================
           زر الحفظ
           ========================================================== -->

      <button
        id="saveButton"
        onclick="saveCourse()">

        💾 حفظ التعديل

      </button>


      <!-- ==========================================================
           الرسالة
           ========================================================== -->

      <div
        id="message"
        class="message">
      </div>


      <div class="note">

        ⚠️ بعد الحفظ، قد يستغرق ظهور التعديل على الموقع
        دقيقة أو دقيقتين بسبب GitHub Pages.

      </div>

    </div>

  </div>

</div>


<script>

  // ==========================================================
  // 🔗 رابط Google Apps Script
  // ==========================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxPotVvMJL14gQPMzWRbJYL5gcCdYGnzYahrgj4BPQrscVJ3W98zEzbfKpqwKJt5ZmT/exec";


  // ==========================================================
  // 📦 بيانات الدورات
  // ==========================================================

  let courses = [];

  let currentPage = "index1";


  // ==========================================================
  // 📄 أسماء الملفات
  // ==========================================================

  const PAGE_FILES = {

    index1: "index.html",

    index2: "index2.html",

    index3: "index3.html"

  };


  // ==========================================================
  // 🚀 عند فتح الصفحة
  // ==========================================================

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      loadCourses();

    }
  );


  // ==========================================================
  // 🔄 تغيير الصفحة
  // ==========================================================

  async function changePage(page) {

    if (!PAGE_FILES[page]) {

      showMessage(
        "صفحة غير صحيحة",
        "error"
      );

      return;
    }


    currentPage = page;


    // تحديث شكل الأزرار

    document
      .querySelectorAll(".page-button")
      .forEach(function(button) {

        button.classList.remove("active");

        if (
          button.dataset.page === page
        ) {

          button.classList.add("active");

        }

      });


    // اسم الملف

    document.getElementById(
      "currentFile"
    ).textContent =
      "الملف الحالي: " +
      PAGE_FILES[page];


    // تنظيف البيانات القديمة

    courses = [];

    document.getElementById(
      "courseSelect"
    ).innerHTML =
      '<option value="">اختر الدورة...</option>';


    document.getElementById(
      "courseName"
    ).value = "";


    document.getElementById(
      "startDate"
    ).value = "";


    document.getElementById(
      "endDate"
    ).value = "";


    document.getElementById(
      "formArea"
    ).style.display = "none";


    document.getElementById(
      "loading"
    ).style.display = "block";


    document.getElementById(
      "loading"
    ).textContent =
      "جاري تحميل دورات " +
      PAGE_FILES[page] +
      "...";


    // تحميل الدورات الجديدة

    await loadCourses();

  }


  // ==========================================================
  // 📥 تحميل الدورات
  // ==========================================================

  async function loadCourses() {

    const loading =
      document.getElementById("loading");

    const formArea =
      document.getElementById("formArea");


    loading.style.display = "block";

    formArea.style.display = "none";


    try {

      const url =
        API_URL +
        "?action=getCourses" +
        "&page=" +
        encodeURIComponent(currentPage);


      console.log(
        "Get Courses URL:",
        url
      );


      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          "HTTP Error: " +
          response.status
        );

      }


      const result =
        await response.json();


      console.log(
        "Courses:",
        result
      );


      if (!result.success) {

        throw new Error(
          result.error ||
          "فشل تحميل الدورات"
        );

      }


      courses =
        result.courses || [];


      fillCourseSelect();


      loading.style.display =
        "none";

      formArea.style.display =
        "block";


    } catch (error) {

      console.error(error);


      loading.innerHTML =
        "❌ حدث خطأ أثناء تحميل الدورات<br><br>" +
        error.message;

    }

  }


  // ==========================================================
  // 📋 ملء قائمة الدورات
  // ==========================================================

  function fillCourseSelect() {

    const select =
      document.getElementById(
        "courseSelect"
      );


    select.innerHTML =
      '<option value="">اختر الدورة...</option>';


    courses.forEach(
      function(course, index) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          index;


        option.textContent =
          course.name;


        select.appendChild(
          option
        );

      }
    );

  }


  // ==========================================================
  // 🔄 عند اختيار دورة
  // ==========================================================

  document
    .getElementById("courseSelect")
    .addEventListener(
      "change",
      function () {

        const index =
          this.value;


        if (index === "") {

          document.getElementById(
            "courseName"
          ).value = "";


          document.getElementById(
            "startDate"
          ).value = "";


          document.getElementById(
            "endDate"
          ).value = "";


          return;

        }


        const course =
          courses[index];


        document.getElementById(
          "courseName"
        ).value =
          course.name;


        document.getElementById(
          "startDate"
        ).value =
          convertToDateInput(
            course.start
          );


        document.getElementById(
          "endDate"
        ).value =
          convertToDateInput(
            course.end
          );

      }
    );


  // ==========================================================
  // 📅 تحويل التاريخ إلى input date
  // ==========================================================

  function convertToDateInput(
    dateString
  ) {

    if (!dateString) {

      return "";

    }


    const parts =
      dateString.split("-");


    if (parts.length !== 3) {

      return "";

    }


    const year =
      parts[0];


    const month =
      parts[1].padStart(2, "0");


    const day =
      parts[2].padStart(2, "0");


    return (
      year +
      "-" +
      month +
      "-" +
      day
    );

  }


  // ==========================================================
  // 💾 حفظ التعديل
  // ==========================================================

  async function saveCourse() {

    const select =
      document.getElementById(
        "courseSelect"
      );


    const saveButton =
      document.getElementById(
        "saveButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    const index =
      select.value;


    // ------------------------------------------
    // التحقق من اختيار الدورة
    // ------------------------------------------

    if (index === "") {

      showMessage(
        "من فضلك اختر الدورة أولًا",
        "error"
      );

      return;

    }


    const oldCourse =
      courses[index];


    const newName =
      document
        .getElementById(
          "courseName"
        )
        .value
        .trim();


    const start =
      document.getElementById(
        "startDate"
      ).value;


    const end =
      document.getElementById(
        "endDate"
      ).value;


    // ------------------------------------------
    // التحقق من البيانات
    // ------------------------------------------

    if (!newName) {

      showMessage(
        "من فضلك اكتب اسم الدورة",
        "error"
      );

      return;

    }


    if (!start) {

      showMessage(
        "من فضلك اختر تاريخ البداية",
        "error"
      );

      return;

    }


    if (!end) {

      showMessage(
        "من فضلك اختر تاريخ النهاية",
        "error"
      );

      return;

    }


    if (end < start) {

      showMessage(
        "تاريخ النهاية لا يمكن أن يكون قبل تاريخ البداية",
        "error"
      );

      return;

    }


    // ------------------------------------------
    // تعطيل الزر
    // ------------------------------------------

    saveButton.disabled =
      true;


    saveButton.textContent =
      "⏳ جاري الحفظ...";


    message.className =
      "message";


    message.style.display =
      "none";


    try {

      // ----------------------------------------
      // تجهيز البيانات
      // ----------------------------------------

      const params =
        new URLSearchParams();


      params.append(
        "action",
        "updateCourse"
      );


      params.append(
        "page",
        currentPage
      );


      params.append(
        "oldName",
        oldCourse.name
      );


      params.append(
        "newName",
        newName
      );


      params.append(
        "start",
        removeLeadingZeros(start)
      );


      params.append(
        "end",
        removeLeadingZeros(end)
      );


      // ----------------------------------------
      // إرسال التعديل باستخدام GET
      // ----------------------------------------

      const requestUrl =
        API_URL +
        "?" +
        params.toString();


      console.log(
        "Update URL:",
        requestUrl
      );


      const response =
        await fetch(
          requestUrl
        );


      if (!response.ok) {

        throw new Error(
          "HTTP Error: " +
          response.status
        );

      }


      const result =
        await response.json();


      console.log(
        "Update result:",
        result
      );


      if (!result.success) {

        throw new Error(
          result.error ||
          "فشل حفظ التعديل"
        );

      }


      // ----------------------------------------
      // نجاح
      // ----------------------------------------

      showMessage(
        "✅ تم حفظ تعديل الدورة بنجاح في " +
        PAGE_FILES[currentPage],
        "success"
      );


      // ----------------------------------------
      // تحديث البيانات محليًا
      // ----------------------------------------

      courses[index] = {

        name: newName,

        start:
          removeLeadingZeros(
            start
          ),

        end:
          removeLeadingZeros(
            end
          )

      };


      fillCourseSelect();


      select.value =
        index;


    } catch (error) {

      console.error(error);


      showMessage(
        "❌ حدث خطأ أثناء الحفظ: " +
        error.message,
        "error"
      );


    } finally {

      saveButton.disabled =
        false;


      saveButton.textContent =
        "💾 حفظ التعديل";

    }

  }


  // ==========================================================
  // 📅 إزالة الأصفار من التاريخ
  // ==========================================================

  function removeLeadingZeros(
    dateString
  ) {

    const parts =
      dateString.split("-");


    if (parts.length !== 3) {

      return dateString;

    }


    return (

      Number(parts[0]) +

      "-" +

      Number(parts[1]) +

      "-" +

      Number(parts[2])

    );

  }


  // ==========================================================
  // 💬 إظهار رسالة
  // ==========================================================

  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        "message"
      );


    message.textContent =
      text;


    message.className =
      "message " + type;


    message.style.display =
      "block";

  }

</script>

</body>
</html>
